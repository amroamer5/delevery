<title>وصال دليفري | Wasal Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --yellow:#FFC629;
    --yellow-dark:#F0AF00;
    --black:#17171A;
    --charcoal:#26262B;
    --red:#E63946;
    --green:#1FA35C;
    --green-bg:#E5F7ED;
    --blue:#2563EB;
    --blue-bg:#E8EFFE;
    --amber:#B45309;
    --amber-bg:#FEF3C7;
    --gray-bg:#F4F5F7;
    --gray-line:#E7E8EC;
    --text:#1A1A1E;
    --text-mut:#7A7A85;
    --white:#fff;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--gray-bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{font-family:'Cairo',sans-serif;}
  ::selection{background:var(--yellow);}

  /* ---------- top shell ---------- */
  .shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .brandbar{
    width:100%;
    background:var(--black);
    color:var(--white);
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:0;
    z-index:50;
    flex-wrap:wrap;
  }
  .brandbar .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;}
  .brandbar .logo .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--yellow),var(--yellow-dark));
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 0 0 2px var(--red) inset;
  }
  .brandbar .logo small{display:block;font-weight:500;font-size:10px;color:#B9B9C2;letter-spacing:.5px;}
  .tabs{display:flex;gap:6px;background:#0000004d;padding:4px;border-radius:12px;}
  .tabs button{
    border:none;background:transparent;color:#C9C9D2;
    padding:9px 14px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;
    transition:.15s;display:flex;align-items:center;gap:6px;
  }
  .tabs button.active{background:var(--yellow);color:var(--black);}
  .tabs button:not(.active):hover{color:var(--white);}

  .stage{
    width:100%;
    max-width:1180px;
    padding:28px 18px 60px;
    display:flex;
    justify-content:center;
  }

  /* ---------- phone frame ---------- */
  .phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .phone-frame{
    width:340px;
    height:696px;
    background:var(--black);
    border-radius:44px;
    padding:12px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4), 0 0 0 1px #00000010;
    position:relative;
  }
  .phone-notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:120px;height:22px;background:var(--black);border-radius:0 0 16px 16px;z-index:5;
  }
  .phone-screen{
    width:100%;height:100%;
    background:var(--white);
    border-radius:32px;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
    display:flex;flex-direction:column;
    scrollbar-width:none;
  }
  .phone-screen::-webkit-scrollbar{display:none;}
  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px 4px;font-size:12px;font-weight:700;color:var(--text);flex-shrink:0;
  }
  .caption{font-size:12px;color:var(--text-mut);font-weight:700;text-align:center;}

  /* ---------- generic bits ---------- */
  .px{padding-left:18px;padding-right:18px;}
  .screen-body{flex:1;display:flex;flex-direction:column;padding:6px 18px 18px;}
  .app-head{
    background:var(--black);color:var(--white);
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .app-head .word{font-weight:800;font-size:16px;}
  .app-head .word span{color:var(--yellow);}
  .back-row{display:flex;align-items:center;gap:10px;padding:8px 4px 12px;flex-shrink:0;}
  .back-btn{
    width:32px;height:32px;border-radius:50%;background:var(--gray-bg);border:none;
    display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:var(--text);
  }
  .screen-title{font-weight:800;font-size:16px;}

  h1,h2,h3,p{margin:0;}
  .muted{color:var(--text-mut);}
  .center{text-align:center;}

  .btn{
    border:none;border-radius:13px;padding:13px 16px;font-weight:800;font-size:14.5px;
    cursor:pointer;transition:.12s; width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--yellow);color:var(--black);}
  .btn-primary:hover{background:var(--yellow-dark);}
  .btn-dark{background:var(--black);color:var(--white);}
  .btn-green{background:var(--green);color:var(--white);}
  .btn-red{background:var(--red);color:var(--white);}
  .btn-outline{background:var(--white);color:var(--text);border:1.5px solid var(--gray-line);}
  .btn-ghost{background:var(--gray-bg);color:var(--text);}
  .btn-sm{padding:9px 12px;font-size:12.5px;border-radius:10px;}
  .btn-row{display:flex;gap:10px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-mut);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--gray-line);
    font-size:14px;background:var(--gray-bg);color:var(--text);outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--yellow-dark);background:var(--white);}

  .card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius);padding:14px;}
  .card + .card{margin-top:10px;}
  .shadow-card{box-shadow:0 6px 18px -8px rgba(0,0,0,.15);border:1px solid var(--gray-line);}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;}
  .badge-pending{background:var(--amber-bg);color:var(--amber);}
  .badge-accepted{background:var(--blue-bg);color:var(--blue);}
  .badge-transit{background:#E0F2FE;color:#0369A1;}
  .badge-delivered{background:var(--green-bg);color:var(--green);}
  .badge-cancelled{background:#FEE2E2;color:#B91C1C;}

  .row{display:flex;align-items:center;justify-content:space-between;}
  .chip{
    background:var(--gray-bg);border-radius:12px;padding:12px 8px;text-align:center;font-size:11.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:1.5px solid transparent;
  }
  .chip:hover{border-color:var(--yellow);}
  .chip .ic{font-size:20px;}
  .chips-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

  .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--black);color:var(--yellow);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;
  }

  .empty{padding:40px 10px;text-align:center;color:var(--text-mut);}
  .empty .ic{font-size:34px;display:block;margin-bottom:10px;}

  /* timeline */
  .timeline{position:relative;padding-right:26px;}
  .timeline::before{content:'';position:absolute;right:9px;top:6px;bottom:6px;width:2px;background:var(--gray-line);}
  .tl-item{position:relative;padding-bottom:20px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{position:absolute;right:-26px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--white);border:3px solid var(--gray-line);display:flex;align-items:center;justify-content:center;}
  .tl-item.done .tl-dot{border-color:var(--green);background:var(--green);}
  .tl-item.current .tl-dot{border-color:var(--yellow-dark);background:var(--yellow);}
  .tl-label{font-weight:700;font-size:13.5px;}
  .tl-time{font-size:11.5px;color:var(--text-mut);margin-top:2px;}

  /* route box */
  .route-box{
    background:linear-gradient(180deg,#EAF3FF,#F4F8FF);border-radius:16px;padding:18px 16px;position:relative;overflow:hidden;
    border:1px solid #DCE8FB;
  }
  .route-line{display:flex;flex-direction:column;gap:0;margin-top:8px;}
  .route-point{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .route-point .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .route-point.from .dot{background:var(--black);}
  .route-point.to .dot{background:var(--red);}
  .route-connector{width:2px;height:26px;background:repeating-linear-gradient(180deg,#9AAFCB 0 4px,transparent 4px 8px);margin-right:5px;}

  /* bottom nav */
  .bottom-nav{
    display:flex;border-top:1px solid var(--gray-line);background:var(--white);flex-shrink:0;
  }
  .bottom-nav button{
    flex:1;border:none;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--text-mut);cursor:pointer;
  }
  .bottom-nav button .ic{font-size:19px;}
  .bottom-nav button.active{color:var(--black);}
  .bottom-nav button.active .ic{filter:drop-shadow(0 0 0 var(--yellow));}

  /* ---------- admin dashboard ---------- */
  .admin-wrap{width:100%;max-width:1180px;display:flex;gap:20px;}
  .admin-login-wrap{width:100%;display:flex;justify-content:center;padding-top:40px;}
  .admin-login-card{
    width:360px;background:var(--white);border-radius:20px;padding:32px 26px;box-shadow:0 20px 50px -20px rgba(0,0,0,.25);
    border:1px solid var(--gray-line);
  }
  .sidebar{
    width:220px;background:var(--black);border-radius:18px;padding:18px 14px;height:fit-content;
    display:flex;flex-direction:column;gap:4px;flex-shrink:0;
  }
  .sidebar .side-logo{color:var(--white);font-weight:800;padding:6px 10px 18px;font-size:15px;}
  .sidebar .side-logo span{color:var(--yellow);}
  .sidebar button{
    text-align:right;background:transparent;border:none;color:#C9C9D2;padding:11px 12px;border-radius:11px;
    font-weight:700;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;
  }
  .sidebar button.active{background:var(--yellow);color:var(--black);}
  .sidebar button:not(.active):hover{background:#ffffff14;color:var(--white);}
  .sidebar .logout{margin-top:14px;color:var(--red);}

  .admin-main{flex:1;min-width:0;}
  .admin-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .admin-topline h2{font-size:20px;font-weight:800;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
  .stat-card{background:var(--white);border-radius:16px;padding:18px;border:1px solid var(--gray-line);}
  .stat-card .num{font-size:26px;font-weight:900;}
  .stat-card .lbl{font-size:12.5px;color:var(--text-mut);font-weight:700;margin-top:4px;}
  .stat-card.c1 .num{color:var(--green);}
  .stat-card.c2 .num{color:var(--blue);}
  .stat-card.c3 .num{color:var(--amber);}
  .stat-card.c4 .num{color:var(--red);}

  table.admtable{width:100%;border-collapse:collapse;background:var(--white);border-radius:16px;overflow:hidden;border:1px solid var(--gray-line);}
  table.admtable th{background:var(--gray-bg);font-size:12px;color:var(--text-mut);text-align:right;padding:12px 14px;font-weight:800;}
  table.admtable td{padding:12px 14px;font-size:13.5px;border-top:1px solid var(--gray-line);}
  table.admtable tr:hover td{background:#FAFAFB;}

  .filter-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .filter-tabs button{
    border:1.5px solid var(--gray-line);background:var(--white);padding:8px 16px;border-radius:20px;
    font-weight:700;font-size:12.5px;cursor:pointer;color:var(--text-mut);
  }
  .filter-tabs button.active{background:var(--black);color:var(--yellow);border-color:var(--black);}

  .panel{background:var(--white);border-radius:16px;border:1px solid var(--gray-line);padding:18px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .bar-row .bar-lbl{width:110px;font-size:12.5px;font-weight:700;color:var(--text-mut);flex-shrink:0;}
  .bar-track{flex:1;height:14px;background:var(--gray-bg);border-radius:8px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--yellow),var(--yellow-dark));}
  .bar-row .bar-val{width:34px;text-align:left;font-weight:800;font-size:12.5px;}

  .zone-row{display:grid;grid-template-columns:1.4fr .7fr .9fr .8fr;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--gray-line);}
  .zone-row.head{border-top:none;font-size:11.5px;color:var(--text-mut);font-weight:800;}
  .zone-row input{width:100%;padding:8px 10px;border-radius:9px;border:1.5px solid var(--gray-line);font-size:13px;background:var(--gray-bg);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--black);color:var(--white);padding:12px 22px;border-radius:30px;font-weight:700;font-size:13.5px;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translate(-50%,-6px);}

  /* ---------- fantasy polish: transitions, live map, signature, confetti ---------- */
  .fade-in{flex:1;display:flex;flex-direction:column;animation:fadeSlide .32s cubic-bezier(.2,.8,.3,1);}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);}}

  .route-box.live{background:linear-gradient(180deg,#FFF8E1,#FFFDF6);border:1px solid #FDE68A;}
  .live-pill{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:pulseDot 1.1s infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.35;transform:scale(.7);}}
  .live-track{position:relative;height:8px;background:#F3D98455;border-radius:6px;margin-top:16px;direction:ltr;}
  .live-progress{position:absolute;top:0;left:0;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--yellow-dark),var(--yellow));transition:width 1s ease;}
  .live-bike{position:absolute;top:-15px;transform:translateX(50%);font-size:20px;transition:left 1s ease;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  .live-eta{display:flex;justify-content:space-between;margin-top:10px;}

  #sigCanvas{width:100%;height:120px;display:block;background:var(--gray-bg);border-radius:12px;border:1.5px dashed var(--gray-line);touch-action:none;cursor:crosshair;}
  .sig-thumb{width:100%;height:70px;object-fit:contain;background:var(--gray-bg);border-radius:10px;border:1px solid var(--gray-line);}

  .confetti-wrap{position:relative;height:0;overflow:visible;}
  .confetti-piece{position:absolute;top:-14px;width:7px;height:13px;opacity:.95;animation:confettiFall 1.5s ease-in forwards;border-radius:2px;}
  @keyframes confettiFall{to{transform:translateY(230px) rotate(340deg);opacity:0;}}

  .sparkline-wrap{width:100%;overflow:hidden;}
  .glow-badge{box-shadow:0 0 0 4px #FFC62922;}

  /* dark mode */
  body.dark{background:#0E0E11;}
  body.dark .phone-screen, body.dark .admin-main .panel, body.dark .stat-card, body.dark .card,
  body.dark table.admtable, body.dark .admin-login-card, body.dark .zone-row input, body.dark .field input,
  body.dark .field select{background:#1B1B20;color:#EDEDF2;border-color:#2C2C33;}
  body.dark .muted, body.dark .text-mut, body.dark table.admtable th{color:#9A9AA5 !important;}
  body.dark table.admtable th{background:#141417;}
  body.dark table.admtable td{border-color:#2C2C33;}
  body.dark .chip{background:#1B1B20;color:#EDEDF2;}
  body.dark .bottom-nav{background:#1B1B20;border-color:#2C2C33;}
  body.dark .bottom-nav button{color:#8A8A94;}
  body.dark .bottom-nav button.active{color:#fff;}
  body.dark .filter-tabs button{background:#1B1B20;color:#9A9AA5;border-color:#2C2C33;}
  body.dark .route-box{background:#151519;border-color:#2C2C33;}
  body.dark .route-box.live{background:linear-gradient(180deg,#241f0c,#17140a);border-color:#4a3d10;}
  body.dark .empty{color:#8A8A94;}
  body.dark #sigCanvas{background:#141417;border-color:#3a3a42;}
  .topbtn{
    width:38px;height:38px;border-radius:50%;border:none;background:#ffffff14;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;
  }
  .topbtn.active{background:var(--yellow);color:var(--black);}
  .topctrls{display:flex;gap:8px;align-items:center;}
  .search-input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--gray-line);background:var(--gray-bg);font-size:13.5px;margin-bottom:12px;}

  /* chat */
  .chat-row{display:flex;flex-direction:column;margin-bottom:2px;}
  .chat-row.mine{align-items:flex-end;}
  .chat-row.theirs{align-items:flex-start;}
  .chat-bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:12.5px;line-height:1.5;}
  .chat-bubble.mine{background:var(--yellow);color:var(--black);border-bottom-left-radius:4px;}
  .chat-bubble.theirs{background:var(--gray-bg);color:var(--text);border-bottom-right-radius:4px;}
  .chat-time{font-size:9.5px;color:var(--text-mut);margin-top:2px;}

    o.type='sine'; o.frequency.value = freq || 880; g.gain.value = 0.055;
    o.connect(g); g.connect(ctx.destination); o.start();
    setTimeout(()=>{ try{ o.stop(); ctx.close(); }catch(e){} }, 130);

}

/* ---------- live map / tracking ---------- */
function coordFor(zoneId){
  const z = state.zones.find(zz=>zz.id===zoneId);
  return z ? {lat:z.lat, lng:z.lng} : HUB;
}
function lerp(a,b,t){ return a + (b-a)*t; }

/* ---------- real road routing (OSRM), cached per destination zone ---------- */
let routeCache = {};
function haversine(a,b){
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLng=(b[1]-a[1])*Math.PI/180;
  const la1=a[0]*Math.PI/180, la2=b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
function pointAlongPath(coords, pct){
  if(!coords || coords.length<2) return coords ? coords[0] : null;
  let total=0; const segLens=[];
  for(let i=1;i<coords.length;i++){ const d=haversine(coords[i-1],coords[i]); segLens.push(d); total+=d; }
  let target = total*pct, acc=0;
  for(let i=0;i<segLens.length;i++){
    if(acc+segLens[i] >= target){
      const segPct = segLens[i] ? (target-acc)/segLens[i] : 0;
      const a=coords[i], b=coords[i+1];
      return [lerp(a[0],b[0],segPct), lerp(a[1],b[1],segPct)];
    }
    acc += segLens[i];
  }
  return coords[coords.length-1];
}
function getRoadRoute(zoneId, cb){
  if(routeCache[zoneId] !== undefined){ cb(routeCache[zoneId]); return; }
  if(!navigator.onLine){ cb(null); return; }
  const to = coordFor(zoneId);
  const url = 'https://router.project-osrm.org/route/v1/driving/'+HUB.lng+','+HUB.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson';
  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(data && data.code==='Ok' && data.routes && data.routes[0]){
      const coords = data.routes[0].geometry.coordinates.map(function(c){ return [c[1],c[0]]; });
      routeCache[zoneId] = {coords:coords, distanceKm:Math.round(data.routes[0].distance/1000)};
    } else { routeCache[zoneId] = null; }
    cb(routeCache[zoneId]);
  }).catch(function(){ routeCache[zoneId] = null; cb(null); });
}

let currentMap = null;
function initMaps(){
  const single = document.getElementById('liveMapContainer');
  const fleet = document.getElementById('fleetMapContainer');
  if(!single && !fleet){
    if(currentMap){ try{ currentMap.remove(); }catch(e){} currentMap = null; }
    return;
  }
  if(single) refreshLiveMaps(single);
  else if(fleet) refreshFleetMap(fleet);
}
function refreshLiveMaps(el){
  if(!el || typeof L === 'undefined'){
    if(currentMap){ try{ currentMap.remove(); }catch(e){} currentMap = null; }
    return;
  }
  const orderId = parseInt(el.getAttribute('data-order'), 10);
  const order = getOrder(orderId);
  if(!order) return;

  if(currentMap){ try{ currentMap.remove(); }catch(e){} currentMap = null; }
  try{
    const from = HUB;
    const to = coordFor(order.toZoneId);
    const cached = routeCache[order.toZoneId];
    const pathCoords = cached ? cached.coords : null;
    const pct = order.status==='in_transit' ? liveProgressPct(order)/100 : (order.status==='delivered' ? 1 : 0.04);
    const curPoint = pathCoords ? pointAlongPath(pathCoords, pct) : [lerp(from.lat,to.lat,pct), lerp(from.lng,to.lng,pct)];

    const map = L.map(el, {zoomControl:false, attributionControl:true, scrollWheelZoom:false, dragging:true, tap:true});
    L.control.zoom({position:'bottomright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18, attribution:'© OpenStreetMap'
    }).addTo(map);

    const bounds = L.latLngBounds([[from.lat,from.lng],[to.lat,to.lng]]);
    map.fitBounds(bounds, {padding:[34,34]});

    const hubIcon = L.divIcon({html:'<div style="background:#17171A;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.4)">🏬</div>', className:'', iconSize:[26,26], iconAnchor:[13,13]});
    const destIcon = L.divIcon({html:'<div style="background:#E63946;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)"></div>', className:'', iconSize:[24,24], iconAnchor:[12,24]});
    const bikeIcon = L.divIcon({html:'<div style="font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))">🏍️</div>', className:'', iconSize:[26,26], iconAnchor:[13,13]});

    L.marker([from.lat,from.lng], {icon:hubIcon}).addTo(map).bindPopup(HUB.name);
    L.marker([to.lat,to.lng], {icon:destIcon}).addTo(map).bindPopup(order.toName+' — طلب #'+order.id);
    let routeLine = L.polyline(pathCoords || [[from.lat,from.lng],[to.lat,to.lng]], {color:'#F0AF00', weight: pathCoords?4:3, dashArray: pathCoords?null:'6,8', opacity:.9}).addTo(map);

    let bikeMarker = null;
    if(order.status==='accepted' || order.status==='in_transit'){
      bikeMarker = L.marker(curPoint, {icon:bikeIcon}).addTo(map).bindPopup('المندوب الآن');
    }
    currentMap = map;
    setTimeout(function(){ if(currentMap){ try{ currentMap.invalidateSize(); }catch(e){} } }, 320);

    if(!cached){
      const mapRef = map;
      getRoadRoute(order.toZoneId, function(route){
        if(currentMap !== mapRef || !route) return; // map replaced or route unavailable, skip
        try{
          routeLine.setLatLngs(route.coords);
          routeLine.setStyle({dashArray:null, weight:4});
          if(bikeMarker){
            const p2 = pointAlongPath(route.coords, pct);
            bikeMarker.setLatLng(p2);
          }
        }catch(e){}
      });
    }
  }catch(e){ /* map init failed silently (e.g. no internet) */ }
}
function refreshFleetMap(el){
  if(!el || typeof L === 'undefined') return;
  if(currentMap){ try{ currentMap.remove(); }catch(e){} currentMap = null; }
  try{
    const map = L.map(el, {zoomControl:true, scrollWheelZoom:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18, attribution:'© OpenStreetMap'
    }).addTo(map);

    const hubIcon = L.divIcon({html:'<div style="background:#17171A;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.4)">🏬</div>', className:'', iconSize:[28,28], iconAnchor:[14,14]});
    L.marker([HUB.lat,HUB.lng], {icon:hubIcon}).addTo(map).bindPopup(HUB.name);

    const statusColor = {pending:'#B45309', accepted:'#2563EB', in_transit:'#0369A1'};
    const active = state.orders.filter(o=>o.status==='pending'||o.status==='accepted'||o.status==='in_transit');
    const boundsPoints = [[HUB.lat,HUB.lng]];

    active.forEach(function(o){
      const to = coordFor(o.toZoneId);
      const meta = statusMeta(o.status);
      const color = statusColor[o.status] || '#666';
      const icon = L.divIcon({html:'<div style="background:'+color+';color:#fff;min-width:26px;height:22px;padding:0 6px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap">#'+o.id+'</div>', className:'', iconSize:[30,22], iconAnchor:[15,11]});
      L.marker([to.lat,to.lng], {icon:icon}).addTo(map).bindPopup('<b>طلب #'+o.id+'</b><br>'+o.customerName+'<br>'+meta.ic+' '+meta.label);
      boundsPoints.push([to.lat,to.lng]);
      if(o.status==='accepted' || o.status==='in_transit'){
        const cached = routeCache[o.toZoneId];
        const pct = o.status==='in_transit' ? liveProgressPct(o)/100 : 0.04;
        const curPoint = cached ? pointAlongPath(cached.coords, pct) : [lerp(HUB.lat,to.lat,pct), lerp(HUB.lng,to.lng,pct)];
        const bikeIcon = L.divIcon({html:'<div style="font-size:19px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">🏍️</div>', className:'', iconSize:[22,22], iconAnchor:[11,11]});
        L.marker(curPoint, {icon:bikeIcon}).addTo(map).bindPopup('مندوب — طلب #'+o.id);
        L.polyline(cached ? cached.coords : [[HUB.lat,HUB.lng],[to.lat,to.lng]], {color:'#F0AF00', weight: cached?3:2, dashArray: cached?null:'5,7', opacity:.6}).addTo(map);
        if(!cached) getRoadRoute(o.toZoneId, function(){}); // warm cache for next render
      }
    });

    if(boundsPoints.length>1){ map.fitBounds(L.latLngBounds(boundsPoints), {padding:[36,36]}); }
    else{ map.setView([HUB.lat,HUB.lng], 9); }

    currentMap = map;
    setTimeout(function(){ if(currentMap){ try{ currentMap.invalidateSize(); }catch(e){} } }, 320);
  }catch(e){ /* map init failed silently (e.g. no internet) */ }
}

/* ---------- signature pad ---------- */
let sigDrawing=false, sigCtx=null;
function sigPos(e,canvas){
  const rect=canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return {x:cx-rect.left, y:cy-rect.top};
}
function sigStart(e){
  const canvas=$('sigCanvas'); if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle='#17171A'; sigCtx.lineWidth=2.5; sigCtx.lineCap='round'; sigCtx.lineJoin='round';
  sigDrawing=true;
  const p=sigPos(e,canvas);
  sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y);
  e.preventDefault();
}
function sigMove(e){
  if(!sigDrawing) return;
  const canvas=$('sigCanvas'); if(!canvas) return;
  const p=sigPos(e,canvas);
  sigCtx.lineTo(p.x,p.y); sigCtx.stroke();
  e.preventDefault();
}
function sigEnd(){ sigDrawing=false; }
function clearSig(){
  const canvas=$('sigCanvas'); if(!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}
function saveSignatureAndFinish(orderId){
  const canvas=$('sigCanvas');
  const o=getOrder(orderId);
  if(canvas && o){
    try{ o.signatureData = canvas.toDataURL(); }catch(e){}
  }
  toast('تم حفظ توقيع الاستلام');
  finishDeliveryFlow();
}

/* ---------- admin sparkline ---------- */
function sparklineSVG(orders){
  const data = [10,16,12,19,14,22, Math.max(6, orders.length)];
  const w=520, h=90, pad=6;
  const max = Math.max(...data);
  const step = (w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>{
    const x = pad + i*step;
    const y = h - pad - (v/max)*(h-pad*2);
    return x+','+y;
  });
  const line = pts.join(' ');
  const area = 'M'+pts[0]+' L'+pts.join(' L')+' L'+(w-pad)+','+(h-pad)+' L'+pad+','+(h-pad)+' Z';
  const dots = data.map((v,i)=>{
    const x = pad + i*step;
    const y = h - pad - (v/max)*(h-pad*2);
    return '<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="#F0AF00"/>';
  }).join('');
  return '<div class="sparkline-wrap"><svg viewBox="0 0 '+w+' '+h+'" width="100%" height="90" preserveAspectRatio="none">' +
    '<defs><linearGradient id="sgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFC629" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFC629" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="'+area+'" fill="url(#sgrad)"/>' +
    '<polyline points="'+line+'" fill="none" stroke="#F0AF00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + '</svg></div>';
}

    if(!isNaN(val) && val >= 0) z.price = val;
  });
  render();
  toast('تم تحديث أسعار المناطق بنجاح');
}

/* ============================= RENDER: SHARED WIDGETS ============================= */
function statusBar(){
  return '<div class="statusbar"><span>'+nowTime()+'</span><span>🔋 📶 5G</span></div>';
}
function appHead(){
  return '<div class="app-head"><div class="word">🦅 <span>وصال</span> دليفري</div><div style="font-size:11px;opacity:.7">Wasal Delivery</div></div>';
}
function backRow(title, onBack){
  return '<div class="back-row"><button class="back-btn" onclick="'+onBack+'">›</button><div class="screen-title">'+title+'</div></div>';
}

function timelineHTML(order){
  const steps = order.history;
  return '<div class="timeline">' + steps.map((s,i)=>{
    const isLast = i === steps.length-1;
    const cls = isLast ? (order.status==='delivered' ? 'done' : 'current') : 'done';
    const dotChar = cls==='done' ? '✓' : '•';
    return '<div class="tl-item '+cls+'"><div class="tl-dot" style="font-size:10px;color:'+(cls==='done'?'#fff':'#B45309')+'">'+dotChar+'</div>' +
      '<div class="tl-label">'+s.label+'</div><div class="tl-time">'+s.time+'</div></div>';
  }).join('') + '</div>';
}

function ratingWidget(o){
  if(o.rating){
    return '<div class="card" style="margin-top:10px"><div class="row"><span class="muted" style="font-size:13px">تقييمك للمندوب</span><span style="font-size:16px">' +
      '★'.repeat(o.rating) + '<span style="color:var(--gray-line)">' + '★'.repeat(5-o.rating) + '</span></span></div></div>';
  }
  let stars = '';
  for(let i=1;i<=5;i++){
    stars += '<span style="font-size:26px;cursor:pointer" onclick="rateCourier('+o.id+','+i+')">☆</span>';
  }
  return '<div class="card" style="margin-top:10px;text-align:center"><p style="font-size:12.5px;font-weight:700">قيّم تجربة التوصيل</p><div style="margin-top:6px">'+stars+'</div></div>';
}
function orderCardCustomer(o){
  return '<div class="card" style="cursor:pointer" onclick="viewCustomerOrder('+o.id+')">' +
    '<div class="row"><b>طلب #'+o.id+'</b>'+badge(o.status)+'</div>' +
    '<div class="muted" style="font-size:12.5px;margin-top:6px">📍 '+o.from+' ← '+o.toName+'</div>' +
    '<div class="row" style="margin-top:10px"><span class="muted" style="font-size:12px">'+o.type+' · '+o.distance+' كم</span>' +
    '<b style="color:var(--black)">'+money(o.price)+'</b></div></div>';
}

function bottomNavCustomer(active){

      '<div style="font-weight:900;font-size:24px;margin-top:10px"><span style="color:var(--yellow)">وصال</span> دليفري</div>' +
      '<div style="font-size:12px;letter-spacing:2px;color:#9d9da8;margin-top:2px">تطبيق المندوب</div>' +

    if(!o) return statusBar()+backRow('تفاصيل الطلب','goK(\'available\')')+'<div class="empty"><span class="ic">📦</span>لا يوجد طلب محدد</div>';
    return statusBar() + backRow('طلب #'+o.id,'goK(\'available\')') +
      '<div class="screen-body" style="padding-top:0">' +
      '<div class="row">'+badge(o.status)+'<span class="muted" style="font-size:12px">'+o.type+' · '+o.distance+' كم</span></div>' +
      (o.status==='in_transit' ? liveRouteHTML(o) : '<div class="route-box" style="margin-top:10px"><div class="route-line">' +

      ((o.status==='accepted'||o.status==='in_transit') ? mapCardHTML(o, 160, true, "goK('live_map_full')") : '') +
      '<div class="card" style="margin-top:10px">' +
      '<div class="row" style="padding:5px 0"><span class="muted" style="font-size:13px">العميل</span><b style="font-size:13px">'+o.customerName+'</b></div>' +
      '<div class="row" style="padding:5px 0;border-top:1px solid var(--gray-line)"><span class="muted" style="font-size:13px">الغرض</span><b style="font-size:13px">'+o.purpose+'</b></div>' +
      '<div class="row" style="padding:5px 0;border-top:1px solid var(--gray-line)"><span class="muted" style="font-size:13px">أجرة التوصيل</span><b style="font-size:13px;color:var(--green)">'+money(o.price)+'</b></div>' +

      '</div>' +
      '<div class="card" style="margin-top:10px">'+timelineHTML(o)+'</div>' +
      '<button class="btn btn-ghost btn-sm" style="margin-top:2px" onclick="goK(\'chat\')">💬 المحادثة مع العميل'+(o.messages.length?' ('+o.messages.length+')':'')+'</button>' +
      '<div style="flex:1"></div>' +
      (o.status==='accepted' ? '<button class="btn btn-green" onclick="startDelivery('+o.id+')">🏍️ بدء التوصيل</button>' : '') +
      (o.status==='in_transit' ? '<button class="btn btn-dark" onclick="markDelivered('+o.id+')">✅ تم التسليم</button>' : '') +
      (o.status==='delivered' ? '<button class="btn btn-outline" onclick="finishDeliveryFlow()">إنهاء</button>' : '') +
      '</div>';
  }

      '<p class="muted" style="font-size:12.5px;margin-top:4px">وقّع العميل لتأكيد استلام الشحنة #'+(o?o.id:'')+'</p>' +
      '<div class="card" style="width:100%;margin-top:14px"><div class="row"><span class="muted" style="font-size:13px">التحصيل</span><b style="color:var(--green)">'+(o?money(o.price):'')+'</b></div>' +
      (o && o.codAmount>0 ? '<div class="row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--gray-line)"><span class="muted" style="font-size:13px">COD من المستلم</span><b style="color:var(--red)">'+money(o.codAmount)+'</b></div>' : '') +

  }

        : '<div class="empty"><span class="ic">🚚</span>لا توجد طلبات جارية</div>') +
      '</div>' + bottomNavCourier('my_orders');
  }
  if(k.screen==='account'){
    const delivered = state.orders.filter(o=>o.courierId===1 && o.status==='delivered');

    const earnings = todayDelivered.reduce((s,o)=>s+o.price,0);
    const distanceSum = todayDelivered.reduce((s,o)=>s+o.distance,0);

      '<button class="btn btn-outline" onclick="courierLogout()">تسجيل الخروج</button>' +
      '</div>' + bottomNavCourier('account');
  }

  // available (default)

  return statusBar() + '<div class="screen-body" style="padding-top:6px">' +
    '<div class="row"><h2 style="font-size:17px">الطلبات المتاحة</h2><span class="badge badge-pending">'+available.length+' طلب</span></div>' +
    '<div class="card" style="margin-top:10px"><div class="row"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:13px;font-weight:700">'+(k.online?'🟢 متصل الآن':'⚪ غير متصل')+'</span></div>' +
    '<button class="switch-pill '+(k.online?'on':'')+'" onclick="toggleCourierOnline()"><span class="knob"></span></button></div></div>' +
    '<div style="margin-top:14px">' +
    (!k.online ? '<div class="empty"><span class="ic">⛔</span>أنت غير متصل حالياً<br>فعّل حالتك لاستقبال الطلبات الجديدة</div>' :

      '<button class="btn btn-green btn-sm" style="margin-top:10px" onclick="acceptOrder('+o.id+')">قبول الطلب</button>' +
      '</div>'
    ).join('') : '<div class="empty"><span class="ic">🔍</span>لا توجد طلبات متاحة حالياً<br>سنعلمك فور وصول طلب جديد</div>')) +
    '</div></div>' + bottomNavCourier('available');
}

  app.innerHTML =
    '<div class="shell">' +
      (navigator.onLine===false ? '<div class="offline-banner">⚠️ لا يوجد اتصال بالإنترنت — الخريطة والمزامنة الحية معطلة مؤقتاً</div>' : '') +
      '<div class="brandbar">' +
        '<div class="logo"><div class="mark">🦅</div><div>وصال دليفري<small>WASAL DELIVERY</small></div></div>' +
        '<div class="topctrls">' +
          '<button class="topbtn '+(simRunning?'active':'')+'" title="محاكاة تلقائية" onclick="toggleSimulation()">⚡</button>' +
          '<button class="topbtn '+(document.body.classList.contains('dark')?'active':'')+'" title="الوضع الليلي" onclick="toggleDarkMode()">🌙</button>' +
        '</div>' +
      '</div>' +
      '<div class="stage">' + body + '</div>' +
    '</div>';
  requestAnimationFrame(initMaps);
}

window.addEventListener('online', function(){ render(); toast('عاد الاتصال بالإنترنت ✅'); });
window.addEventListener('offline', function(){ render(); toast('انقطع الاتصال بالإنترنت','⚠️'); });

render();

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
